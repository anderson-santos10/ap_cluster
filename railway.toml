# O edge do Railway encaminha o tráfego para $PORT.
# O CMD do Dockerfile e este startCommand chamam o mesmo script,
# para migrate, collectstatic e o servidor não ficarem definidos duas vezes.
# O bind [::] dentro do script aceita IPv4 e IPv6 na imagem Debian.
[deploy]
startCommand = "/app/entrypoint.prod.sh"
