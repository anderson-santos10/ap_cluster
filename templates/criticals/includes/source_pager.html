{% if page.has_other_pages %}
  <nav class="pager" aria-label="Paginação das linhas de origem">
    {% if page.has_previous %}<a href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.previous_page_number }}">Anterior</a>{% endif %}
    <span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page.next_page_number }}">Próxima</a>{% endif %}
  </nav>
{% endif %}
